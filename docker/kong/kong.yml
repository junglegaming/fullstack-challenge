_format_version: "3.0"

# ===========================================================================
# Plugins Globais
# ===========================================================================
plugins:
  # CORS - Permite que o frontend (localhost:3000/3002) acesse a API
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3002"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Requested-With
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # Rate Limiting Global
  - name: rate-limiting
    config:
      minute: 200
      hour: 5000
      policy: local
      fault_tolerant: true

# ===========================================================================
# Game Service (via Kong)
# ===========================================================================
services:
  - name: games-service
    url: http://games:4001
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 2000
          policy: local
          fault_tolerant: true
    routes:
      # Health check público
      - name: games-health-route
        paths:
          - /games/health
        strip_path: false
        methods:
          - GET

      - name: games-public-routes
        paths:
          - /games/rounds
        strip_path: false
        methods:
          - GET

      # Rotas Protegidas (exigem JWT)
      - name: games-protected-routes
        paths:
          - /games/bets
          - /games/bet
        strip_path: false
        methods:
          - GET
          - POST
        plugins:
         -  name: jwt
            config:
              key_claim_name: sub
              claims_to_verify:
                - exp
                - nbf

# ===========================================================================
# Wallet Service (via Kong)
# ===========================================================================
  - name: wallets-service
    url: http://wallets:4002
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 2000
          policy: local
          fault_tolerant: true
    routes:
      # Rotas Públicas
      - name: wallets-public-routes
        paths:
          - /wallets/health
        strip_path: false
        methods:
          - GET

      # Rotas Protegidas
      - name: wallets-protected-routes
        paths:
          - /wallets
        strip_path: false
        methods:
          - GET
          - POST
        plugins:
          - name: jwt
            config:
              key_claim_name: sub
              claims_to_verify:
                - exp
                - nbf

# ===========================================================================
# Consumers (para validação JWT do Keycloak)
